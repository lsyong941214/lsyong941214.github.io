<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#EEF1F5;font-family:"Apple SD Gothic Neo",sans-serif;color:#141922;display:flex;align-items:center;justify-content:center;gap:72px}
.text{display:grid;gap:22px;width:520px}
h1{font-size:68px;font-weight:800;letter-spacing:-2px;line-height:1.1}
p{font-size:30px;color:#5E6878;line-height:1.45}
.pill{justify-self:start;font-size:24px;font-weight:700;color:#2C4FD8;background:#E3E9FD;border-radius:999px;padding:10px 22px}
.sim{position:relative;width:440px;height:330px;background:#2C4FD8;color:#fff;border-radius:28px 80px 28px 28px;padding:40px;display:flex;flex-direction:column;justify-content:space-between}
.chip{position:absolute;right:40px;bottom:40px;width:72px;height:56px;border:3px solid rgba(255,255,255,.4);border-radius:10px;
 background:linear-gradient(90deg,transparent 32%,rgba(255,255,255,.4) 32% 35%,transparent 35% 65%,rgba(255,255,255,.4) 65% 68%,transparent 68%),linear-gradient(0deg,transparent 47%,rgba(255,255,255,.4) 47% 53%,transparent 53%)}
.lab{font-size:24px;opacity:.85}
.date{font-family:Menlo,monospace;font-size:54px;font-weight:700;letter-spacing:-2px}
.row{display:flex;gap:36px;border-top:2px solid rgba(255,255,255,.3);padding-top:18px;font-size:20px;opacity:.95}
.row b{display:block;font-family:Menlo,monospace;font-size:28px}
</style></head><body>
<div class="text">
  <span class="pill">통신사 43곳 계산 방식 반영</span>
  <h1>알뜰폰<br>약정 계산기</h1>
  <p>할인이 끝나는 날을 계산하고<br>캘린더에 알림으로 등록해요</p>
</div>
<div class="sim"><div class="chip"></div>
  <div><div class="lab">약정변경일 · 정상요금 시작</div><div class="date">2027.06.09</div></div>
  <div class="row"><div><b>212일</b>할인 이용일수</div><div><b>D-3</b>알림</div></div>
</div>
</body></html>
